version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vistiendome_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    # No exponemos puertos al exterior en producción por seguridad

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: vistiendome_backend_prod
    restart: always
    volumes:
      - media_volume_prod:/app/media
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - db

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: vistiendome_frontend_prod
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: vistiendome_proxy_prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - media_volume_prod:/app/media
    depends_on:
      - frontend
      - backend

volumes:
  pgdata_prod:
  media_volume_prod:

networks:
  default:
    driver: bridge
    driver_opts:
       com.docker.network.driver.mtu: 1400