map $http_x_forwarded_proto $cf_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name vistiendomechile.com www.vistiendomechile.com;

    # POR QUE EL DESTINO VA EN UNA VARIABLE
    # Escrito como `proxy_pass http://backend:8000;`, nginx resuelve ese nombre
    # UNA SOLA VEZ, al arrancar, y se queda con esa IP para siempre. Cada
    # `docker compose up --build` recrea backend y frontend, que toman IPs
    # nuevas del bridge, y nginx sigue mandando a las viejas: 502 en todo el
    # sitio, con los tres contenedores "sanos" y sin un solo error en los logs.
    # Ya pasó dos veces, y las dos se arregló reiniciando nginx a mano.
    #
    # 127.0.0.11 es el DNS interno de Docker. Cuando el destino de proxy_pass
    # contiene una variable, nginx lo resuelve en cada petición contra ese DNS
    # en vez de cachearlo al arrancar. Así el proxy sobrevive a que recreen los
    # contenedores, sin que nadie tenga que acordarse de nada.
    #
    # $request_uri hay que ponerlo explícito: con variable, nginx ya no arma
    # solo la ruta de destino.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $destino_backend  backend;
    set $destino_frontend frontend;

    keepalive_requests 100000;
    keepalive_timeout 120s;

    # Backend API
    location /api {
        proxy_pass http://$destino_backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cf_proto;
    }

    # Backend Sockets (si aplica)
    location /ws {
        proxy_pass http://$destino_backend:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Media files (Imagenes de la base de datos)
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Frontend
    location / {
        proxy_pass http://$destino_frontend:80$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cf_proto;
    }
}
