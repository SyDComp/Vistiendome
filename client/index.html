<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El .ico primero y el SVG despues: el navegador que entiende SVG se
         queda con el ultimo que puede usar, y el que no, con el .ico. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- interactive-widget=resizes-content: sin esto el teclado del telefono NO
         achica la pagina, se dibuja ENCIMA, y el boton de accion de cualquier
         formulario queda tapado y sin forma de alcanzarlo. Con esto el alto
         visible se reduce de verdad y `dvh` y `inset: 0` siguen al teclado.

         Se quitaron `maximum-scale=1.0` y `user-scalable=no`: bloqueaban el
         zoom con dos dedos. Quien no ve bien queda sin poder acercar la
         pantalla, y no hay nada que ganar a cambio. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Vistiendomé</title>

    <!-- La fuente del logo. Se carga acá y no con @import dentro del CSS
         porque un @import bloquea el renderizado hasta que baja.
         Es una fuente WEB a proposito: el logo tiene que verse igual en toda
         maquina. Antes el CSS pedia "Cooper Black", que no es una fuente web
         —viene con Office— y en la practica no estaba en ninguna parte: cada
         visita veia la reserva que le tocara. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bevan&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
